name: nhac
description: Delivery Simples e Prático.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.2.0 <4.0.0"
dependencies:
  sentry_flutter: ^9.20.0
  flutter:
    sdk: flutter
  animated_splash_screen: ^1.3.0
  nowa_runtime: ^0.1.3
  provider: ^6.1.5
  shared_preferences: ^2.5.4
  dio: ^5.9.1
  lottie: ^2.7.0
  go_router: ^17.1.0
  sign_in_button: ^3.2.0
  pin_code_fields: ^8.0.1
  flutter_svg: ^2.2.3
  mask_text_input_formatter: ^2.9.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_sign_in: ^6.2.1
  email_validator: ^3.0.0
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  firebase_storage: ^13.3.0
  connectivity_plus: ^6.1.0
  flutter_dotenv: ^6.0.1
  cached_network_image: ^3.4.1
  pay: ^3.3.0
  shimmer: ^3.0.0
  intl: ^0.20.2
  share_plus: ^10.1.4
  sentry: ^9.20.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^21.0.0
  flutter_screenutil: ^5.9.3
  firebase_app_check: ^0.4.4+2
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  local_auth_android: ^1.0.56
  flutter_stripe: ^10.1.1
  qr_flutter: ^4.1.0
  flutter_google_places_sdk: ^0.3.3
  google_maps_flutter: ^2.5.3
  url_launcher: ^6.3.2
  stomp_dart_client: ^3.0.1
dev_dependencies:
  sentry_dart_plugin: ^3.3.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.3.1
  network_image_mock: ^2.1.1
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/animations/
    - assets/fonts/
    - .env
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf

flutter_native_splash:
  color: "#FFFFFF" 
  image: assets/transparente.png
  android_12:
    color: "#FFFFFF" 
    image: assets/transparente.png
sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: nhac
  org: senai-py
