name: E2E cliente

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: 'Ref do Nhac (vazio usa a revisão padrão deste workflow)'
        required: false
        type: string
      backend_ref:
        description: 'Ref do backend (vazio usa a revisão padrão deste workflow)'
        required: false
        type: string
  push:
    branches: [main, eu-e-tu]
  pull_request:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: e2e-cliente-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  resolve-revisions:
    name: Resolver par de revisões E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app_sha: ${{ steps.revisions.outputs.app_sha }}
      backend_sha: ${{ steps.revisions.outputs.backend_sha }}
    steps:
      - name: Resolver revisão do app
        uses: actions/checkout@v4
        with:
          repository: NhacDelivery/Nhac
          ref: ${{ inputs.app_ref || (github.event_name == 'schedule' && 'eu-e-tu' || github.sha) }}
          path: Nhac
          persist-credentials: false
      - name: Resolver revisão do backend
        uses: actions/checkout@v4
        with:
          repository: NhacDelivery/backend-nhac
          ref: ${{ inputs.backend_ref || 'main' }}
          path: backend-nhac
          persist-credentials: false
      - name: Fixar commits para todos os devices
        id: revisions
        run: |
          echo "app_sha=$(git -C Nhac rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "backend_sha=$(git -C backend-nhac rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  e2e:
    needs: resolve-revisions
    name: E2E API${{ matrix.api_level }} ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '{"include":[{"api_level":34,"profile":"pixel_2"},{"api_level":33,"profile":"pixel_6"}]}' || '{"include":[{"api_level":34,"profile":"pixel_2"}]}') }}
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: nhac_e2e
          MARIADB_USER: nhac_e2e
          MARIADB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-nhac-db
          MARIADB_RANDOM_ROOT_PASSWORD: 'true'
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-revisions.outputs.app_sha }}
          persist-credentials: false
          path: Nhac

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: NhacDelivery/backend-nhac
          persist-credentials: false
          ref: ${{ needs.resolve-revisions.outputs.backend_sha }}
          path: backend-nhac

      - name: Registrar revisões efetivamente testadas
        env:
          EXPECTED_APP_SHA: ${{ needs.resolve-revisions.outputs.app_sha }}
          EXPECTED_BACKEND_SHA: ${{ needs.resolve-revisions.outputs.backend_sha }}
          APP_REF: ${{ inputs.app_ref || (github.event_name == 'schedule' && 'eu-e-tu' || github.sha) }}
          BACKEND_REF: ${{ inputs.backend_ref || 'main' }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          app_sha = subprocess.check_output(['git', '-C', 'Nhac', 'rev-parse', 'HEAD'], text=True).strip()
          backend_sha = subprocess.check_output(['git', '-C', 'backend-nhac', 'rev-parse', 'HEAD'], text=True).strip()
          if app_sha != os.environ['EXPECTED_APP_SHA'] or backend_sha != os.environ['EXPECTED_BACKEND_SHA']:
              raise SystemExit('Checkout divergiu das revisões resolvidas; E2E interrompido.')
          metadata = {
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'event': os.environ['GITHUB_EVENT_NAME'],
              'trigger_ref': os.environ['GITHUB_REF'],
              'workflow_repository': os.environ['GITHUB_REPOSITORY'],
              'app': {'repository': 'NhacDelivery/Nhac', 'ref': os.environ['APP_REF'], 'sha': app_sha},
              'backend': {'repository': 'NhacDelivery/backend-nhac', 'ref': os.environ['BACKEND_REF'], 'sha': backend_sha},
          }
          output = Path('e2e-metadata')
          output.mkdir(exist_ok=True)
          (output / 'revisions.json').write_text(json.dumps(metadata, indent=2) + '\n')
          summary = '## Revisões E2E\n\n| Repositório | Ref solicitada | SHA testado |\n|---|---|---|\n'
          for item in (metadata['app'], metadata['backend']):
              summary += f"| {item['repository']} | {item['ref']} | `{item['sha']}` |\n"
          (output / 'revisions.md').write_text(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as file:
              file.write(summary)
          PYTHON

      - name: Testar preflight e orquestração E2E
        working-directory: Nhac
        run: python3 -m unittest discover -s tool -p 'test_*.py' -v

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend-nhac/pom.xml

      - name: Build backend jar
        working-directory: backend-nhac
        run: ./mvnw -B -ntp -q -DskipTests package

      - name: Capture backend JDK
        id: backend-java
        shell: bash
        run: echo "home=$JAVA_HOME" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar ambiente E2E isolado
        working-directory: Nhac
        run: |
          echo 'API_BASE_URL=http://127.0.0.1:8080/api/v1' > .env
          echo 'E2E_MODE=true' >> .env

      - name: Install Flutter dependencies
        working-directory: Nhac
        run: flutter pub get

      - name: Habilitar aceleracao do emulador
        run: sudo chmod 666 /dev/kvm

      - name: Preparar SDK do emulador com retentativa
        shell: bash
        run: |
          SDKMANAGER_BIN="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER_BIN" ]; then
            for candidate in \
              "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" \
              "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager"; do
              if [ -n "$candidate" ] && [ -x "$candidate" ]; then
                SDKMANAGER_BIN="$candidate"
                break
              fi
            done
          fi

          if [ -z "$SDKMANAGER_BIN" ]; then
            echo "sdkmanager indisponível neste runner. O pacote do emulador será preparado pelo android-emulator-runner."
            exit 0
          fi

          for attempt in 1 2 3; do
            if "$SDKMANAGER_BIN" --install emulator --channel=0; then
              exit 0
            fi
            echo "Falha ao instalar emulator (tentativa ${attempt}/3), limpando cache do SDK..."
            "$SDKMANAGER_BIN" --clear-cache || true
            sleep 5
          done
          echo "Não foi possível preparar o pacote emulator após 3 tentativas."
          exit 1

      - name: Executar E2E Android isolado
        timeout-minutes: 95
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          RUN_E2E: 'true'
          E2E_DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-nhac-db
          E2E_DB_MANAGED: 'true'
          E2E_REPEAT: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && '3' || '1' }}
          E2E_DB_CONTAINER: ${{ job.services.mariadb.id }}
          E2E_DEVICE_ID: emulator-5554
          BACKEND_DIR: ${{ github.workspace }}/backend-nhac
          BACKEND_JAVA_HOME: ${{ steps.backend-java.outputs.home }}
        with:
          api-level: ${{ matrix.api_level }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          cores: 3
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 6144M
          disable-animations: true
          working-directory: Nhac
          script: ./tool/run_e2e.sh

      - name: Gerar resumo E2E
        if: always()
        working-directory: Nhac
        shell: bash
        run: |
          echo "## Resultado E2E" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run attempt: ${{ github.run_attempt }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API level: ${{ matrix.api_level }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Perfil: ${{ matrix.profile }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repeat: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && '3' || '1' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if ls e2e-logs/*.log >/dev/null 2>&1; then
            echo "### Últimas linhas dos logs" >> "$GITHUB_STEP_SUMMARY"
            for log_file in e2e-logs/*.log; do
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "\`\`\`text" >> "$GITHUB_STEP_SUMMARY"
              echo "$(basename "$log_file")" >> "$GITHUB_STEP_SUMMARY"
              tail -n 25 "$log_file" >> "$GITHUB_STEP_SUMMARY"
              echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "Sem logs E2E gerados." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ matrix.api_level }}-${{ matrix.profile }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            e2e-metadata
            Nhac/e2e-logs
            Nhac/integration_test/screenshots
            Nhac/build/**/outputs/**/*.mp4
          if-no-files-found: warn
          retention-days: 14
