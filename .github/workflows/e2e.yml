name: E2E cliente

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'integration_test/**'
      - 'test/**'
      - '.github/workflows/build-apk.yml'
      - 'lib/components/home/**'
      - 'lib/controllers/cart_provider.dart'
      - 'lib/e2e/**'
      - 'lib/globals/app_constants.dart'
      - 'lib/globals/router.dart'
      - 'lib/main.dart'
      - 'lib/pages/auth/**'
      - 'lib/pages/bem_vindo.dart'
      - 'lib/pages/carrinho_page.dart'
      - 'lib/pages/checkout_page.dart'
      - 'lib/pages/home_page.dart'
      - 'lib/pages/loja_page.dart'
      - 'lib/pages/produto_detalhes_page.dart'
      - 'lib/pages/rastreio_pedido_page.dart'
      - 'lib/repositories/**'
      - 'lib/services/auth_service.dart'
      - 'lib/services/api_client.dart'
      - 'tool/run_e2e.sh'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-cliente-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  e2e:
    name: E2E-001 a E2E-004 (3x)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: nhac_e2e
          MARIADB_USER: nhac_e2e
          MARIADB_PASSWORD: nhac_e2e
          MARIADB_ROOT_PASSWORD: nhac_e2e_root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: Nhac

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: NhacDelivery/backend-nhac
          ref: main
          path: backend-nhac

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend-nhac/pom.xml

      - name: Capture backend JDK
        id: backend-java
        shell: bash
        run: echo "home=$JAVA_HOME" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configurar ambiente E2E isolado
        working-directory: Nhac
        run: |
          echo 'API_BASE_URL=http://10.0.2.2:8080/api/v1' > .env
          echo 'E2E_MODE=true' >> .env

      - name: Install Flutter dependencies
        working-directory: Nhac
        run: flutter pub get

      - name: Run isolated Android E2E three times
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          RUN_E2E: 'true'
          E2E_DB_MANAGED: 'true'
          E2E_REPEAT: '3'
          E2E_DEVICE_ID: emulator-5554
          BACKEND_DIR: ${{ github.workspace }}/backend-nhac
          BACKEND_JAVA_HOME: ${{ steps.backend-java.outputs.home }}
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          working-directory: Nhac
          script: ./tool/run_e2e.sh

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ github.run_number }}
          path: Nhac/e2e-logs
          if-no-files-found: warn
          retention-days: 14
