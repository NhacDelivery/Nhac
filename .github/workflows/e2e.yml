name: E2E cliente

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: e2e-cliente-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  e2e:
    name: E2E-001 a E2E-004
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: nhac_e2e
          MARIADB_USER: nhac_e2e
          MARIADB_PASSWORD: nhac_e2e
          MARIADB_ROOT_PASSWORD: nhac_e2e_root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: Nhac

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: NhacDelivery/backend-nhac
          ref: f1035bd0b53c22e2a1dc98c71372220238d56369
          path: backend-nhac

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend-nhac/pom.xml

      - name: Build backend jar
        working-directory: backend-nhac
        run: ./mvnw -B -ntp -q -DskipTests package

      - name: Capture backend JDK
        id: backend-java
        shell: bash
        run: echo "home=$JAVA_HOME" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar ambiente E2E isolado
        working-directory: Nhac
        run: |
          echo 'API_BASE_URL=http://127.0.0.1:8080/api/v1' > .env
          echo 'E2E_MODE=true' >> .env

      - name: Install Flutter dependencies
        working-directory: Nhac
        run: flutter pub get

      - name: Habilitar aceleracao do emulador
        run: sudo chmod 666 /dev/kvm

      - name: Executar E2E Android isolado
        timeout-minutes: 95
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          RUN_E2E: 'true'
          E2E_DB_MANAGED: 'true'
          E2E_REPEAT: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && '3' || '1' }}
          E2E_DB_CONTAINER: ${{ job.services.mariadb.id }}
          E2E_DEVICE_ID: emulator-5554
          BACKEND_DIR: ${{ github.workspace }}/backend-nhac
          BACKEND_JAVA_HOME: ${{ steps.backend-java.outputs.home }}
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          cores: 3
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 6144M
          disable-animations: true
          working-directory: Nhac
          script: ./tool/run_e2e.sh

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: Nhac/e2e-logs
          if-no-files-found: warn
          retention-days: 14
