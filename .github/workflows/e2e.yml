name: E2E cliente

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'integration_test/**'
      - 'test/**'
      - '.github/workflows/build-apk.yml'
      - 'lib/components/home/**'
      - 'lib/controllers/cart_provider.dart'
      - 'lib/e2e/**'
      - 'lib/globals/app_constants.dart'
      - 'lib/globals/router.dart'
      - 'lib/main.dart'
      - 'lib/pages/auth/**'
      - 'lib/pages/bem_vindo.dart'
      - 'lib/pages/carrinho_page.dart'
      - 'lib/pages/checkout_page.dart'
      - 'lib/pages/home_page.dart'
      - 'lib/pages/loja_page.dart'
      - 'lib/pages/produto_detalhes_page.dart'
      - 'lib/pages/rastreio_pedido_page.dart'
      - 'lib/repositories/**'
      - 'lib/services/auth_service.dart'
      - 'lib/services/api_client.dart'
      - 'tool/run_e2e.sh'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-cliente-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  e2e:
    name: E2E API${{ matrix.api_level }} ${{ matrix.profile }}
    if: ${{ github.run_attempt <= 2 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '{"include":[{"api_level":34,"profile":"pixel_2"},{"api_level":33,"profile":"pixel_6"}]}' || '{"include":[{"api_level":34,"profile":"pixel_2"}]}') }}
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: nhac_e2e
          MARIADB_USER: nhac_e2e
          MARIADB_PASSWORD: nhac_e2e
          MARIADB_ROOT_PASSWORD: nhac_e2e_root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: Nhac

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: NhacDelivery/backend-nhac
          ref: main
          path: backend-nhac

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend-nhac/pom.xml

      - name: Capture backend JDK
        id: backend-java
        shell: bash
        run: echo "home=$JAVA_HOME" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar ambiente E2E isolado
        working-directory: Nhac
        run: |
          echo 'API_BASE_URL=http://127.0.0.1:8080/api/v1' > .env
          echo 'E2E_MODE=true' >> .env

      - name: Install Flutter dependencies
        working-directory: Nhac
        run: flutter pub get

      - name: Habilitar aceleracao do emulador
        run: sudo chmod 666 /dev/kvm

      - name: Preparar SDK do emulador com retentativa
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if sdkmanager --install emulator --channel=0; then
              exit 0
            fi
            echo "Falha ao instalar emulator (tentativa ${attempt}/3), limpando cache do SDK..."
            sdkmanager --clear-cache || true
            sleep 5
          done
          echo "Não foi possível preparar o pacote emulator após 3 tentativas."
          exit 1

      - name: Executar E2E Android isolado
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          RUN_E2E: 'true'
          E2E_DB_MANAGED: 'true'
          E2E_REPEAT: ${{ github.event_name == 'workflow_dispatch' && '3' || '1' }}
          E2E_DEVICE_ID: emulator-5554
          BACKEND_DIR: ${{ github.workspace }}/backend-nhac
          BACKEND_JAVA_HOME: ${{ steps.backend-java.outputs.home }}
        with:
          api-level: ${{ matrix.api_level }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 6144M
          disable-animations: true
          working-directory: Nhac
          script: ./tool/run_e2e.sh

      - name: Gerar resumo E2E
        if: always()
        working-directory: Nhac
        shell: bash
        run: |
          echo "## Resultado E2E" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run attempt: ${{ github.run_attempt }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API level: ${{ matrix.api_level }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Perfil: ${{ matrix.profile }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repeat: ${{ github.event_name == 'workflow_dispatch' && '3' || '1' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if ls e2e-logs/*.log >/dev/null 2>&1; then
            echo "### Últimas linhas dos logs" >> "$GITHUB_STEP_SUMMARY"
            for log_file in e2e-logs/*.log; do
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "\`\`\`text" >> "$GITHUB_STEP_SUMMARY"
              echo "$(basename "$log_file")" >> "$GITHUB_STEP_SUMMARY"
              tail -n 25 "$log_file" >> "$GITHUB_STEP_SUMMARY"
              echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "Sem logs E2E gerados." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ matrix.api_level }}-${{ matrix.profile }}-${{ github.run_number }}
          path: |
            Nhac/e2e-logs
            Nhac/integration_test/screenshots
            Nhac/build/**/outputs/**/*.mp4
          if-no-files-found: warn
          retention-days: 14
