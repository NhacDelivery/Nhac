name: Build APK

on:
  push:
    branches:
      - main
      - eu-e-tu
      - context-ia-migration
      - feature/checkout-stripe-tests-fix
  pull_request:
    branches:
      - main
      - feature/checkout-stripe-tests-fix
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.7'

jobs:

  # ── Qualidade (analyze + test) ──
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_number }}
          path: coverage/lcov.info
          retention-days: 14
          if-no-files-found: ignore

  # ── Build DEBUG (branches: eu-e-tu e context-ia-migration) ──
  build-debug:
    name: Build Debug APK
    needs: quality
    if: |
      github.ref_name == 'eu-e-tu' || github.base_ref == 'eu-e-tu' ||
      github.ref_name == 'context-ia-migration' || github.base_ref == 'context-ia-migration' ||
      github.ref_name == 'feature/checkout-stripe-tests-fix' || github.base_ref == 'feature/checkout-stripe-tests-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Validate .env and google-services.json
        run: |
          if [ ! -s .env ]; then
            echo "::error::.env está vazio - confira o secret ENV_FILE do repositório"
            exit 1
          fi
          python3 -c "import json; json.load(open('android/app/google-services.json'))" || {
            echo "::error::google-services.json inválido - confira o secret GOOGLE_SERVICES_JSON"
            exit 1
          }
          for key in SENTRY_DSN STRIPE_PUBLISHABLE_KEY GOOGLE_PLACES_API_KEY; do
            grep -q "^$key=" .env || echo "::warning::$key não encontrada em .env (pode causar crash no boot do app)"
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: |
          python3 -c 'import json; lines = (line.strip() for line in open(".env")); json.dump(dict(line.split("=", 1) for line in lines if line and not line.startswith("#") and "=" in line), open(".dart-defines.json", "w"))'
          flutter build apk --debug --dart-define-from-file=.dart-defines.json

      - name: Upload Debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ── Build RELEASE ──
  build-release:
    name: Build Release APK
    needs: quality
    if: (github.ref_name == 'main' || github.base_ref == 'main') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/codemagic.keystore"

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Validate .env and google-services.json
        run: |
          if [ ! -s .env ]; then
            echo "::error::.env está vazio - confira o secret ENV_FILE do repositório"
            exit 1
          fi
          python3 -c "import json; json.load(open('android/app/google-services.json'))" || {
            echo "::error::google-services.json inválido - confira o secret GOOGLE_SERVICES_JSON"
            exit 1
          }
          for key in SENTRY_DSN STRIPE_PUBLISHABLE_KEY GOOGLE_PLACES_API_KEY; do
            grep -q "^$key=" .env || echo "::warning::$key não encontrada em .env (pode causar crash no boot do app)"
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          python3 -c 'import json; lines = (line.strip() for line in open(".env")); json.dump(dict(line.split("=", 1) for line in lines if line and not line.startswith("#") and "=" in line), open(".dart-defines.json", "w"))'
          flutter build apk --release --dart-define-from-file=.dart-defines.json
        env:
          CM_BUILD_DIR: ${{ github.workspace }}
          CM_KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Remove keystore from workspace
        if: always()
        run: rm -f "${{ github.workspace }}/codemagic.keystore"

      - name: Upload Release APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v0.${{ github.run_number }}.0"
          name: "Pre-Release v0.${{ github.run_number }}.0"
          prerelease: true
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
