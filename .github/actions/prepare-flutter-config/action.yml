name: Prepare Flutter config
description: Creates and validates .env and google-services.json, with optional keystore decoding.

inputs:
  env_file_content:
    description: Content for .env file
    required: true
  api_base_url:
    description: Public backend URL included in this build
    required: false
    default: https://backend-nhac.cloud.run/api/v1
  google_services_json:
    description: Content for android/app/google-services.json
    required: true
  require_keystore:
    description: Whether to require and decode KEYSTORE_BASE64
    required: false
    default: 'false'
  keystore_base64:
    description: Base64 encoded keystore content
    required: false
    default: ''
  required_env_keys:
    description: Space-separated .env keys to warn if missing
    required: false
    default: 'SENTRY_DSN STRIPE_PUBLISHABLE_KEY GOOGLE_PLACES_API_KEY'

runs:
  using: composite
  steps:
    - name: Create and validate local config files
      shell: bash
      env:
        API_BASE_URL: ${{ inputs.api_base_url }}
        ENV_FILE_CONTENT: ${{ inputs.env_file_content }}
        GOOGLE_SERVICES_JSON_CONTENT: ${{ inputs.google_services_json }}
        REQUIRE_KEYSTORE: ${{ inputs.require_keystore }}
        KEYSTORE_BASE64: ${{ inputs.keystore_base64 }}
        REQUIRED_ENV_KEYS: ${{ inputs.required_env_keys }}
      run: |
        set -euo pipefail

        mkdir -p android/app

        if [ -n "${ENV_FILE_CONTENT:-}" ]; then
          printf '%s\n' "$ENV_FILE_CONTENT" > .env
        else
          printf 'API_BASE_URL=%s\n' "$API_BASE_URL" > .env
          for key in SENTRY_DSN STRIPE_PUBLISHABLE_KEY GOOGLE_PLACES_API_KEY; do
            printf '%s=\n' "$key" >> .env
          done
          echo "::warning::.env vazio no secret ENV_FILE; usando valores de fallback para CI."
        fi

        if [ -n "${GOOGLE_SERVICES_JSON_CONTENT:-}" ]; then
          printf '%s\n' "$GOOGLE_SERVICES_JSON_CONTENT" > android/app/google-services.json
        else
          cat > android/app/google-services.json <<'EOF'
        {
          "project_info": {
            "project_id": "nhac-ci-placeholder",
            "project_number": "0",
            "storage_bucket": "nhac-ci-placeholder.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:0:android:0000000000000000",
                "android_client_info": {
                  "package_name": "com.nhac.app"
                }
              },
              "api_key": [
                {
                  "current_key": "ci-placeholder-key"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        EOF
          echo "::warning::google-services.json vazio no secret; usando placeholder para CI."
        fi

        if [ ! -s .env ]; then
          echo "::error::.env está vazio - confira o secret ENV_FILE do repositório"
          exit 1
        fi

        python3 - <<'PYCONFIG'
        import os
        import re
        from pathlib import Path
        path = Path('.env')
        content = re.sub(r'^\s*(?:export\s+)?API_BASE_URL\s*=.*$', '', path.read_text(), flags=re.MULTILINE)
        path.write_text(content.rstrip() + '\nAPI_BASE_URL=' + os.environ['API_BASE_URL'] + '\n')
        PYCONFIG

        python3 - <<'PYJSON'
        import json
        from pathlib import Path

        path = Path('android/app/google-services.json')
        try:
            json.load(path.open())
        except Exception:
            echo = __import__('os').system
            echo('::error::google-services.json inválido - confira o secret GOOGLE_SERVICES_JSON')
            raise
        PYJSON

        if [ "$REQUIRE_KEYSTORE" = "true" ]; then
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 está vazio, mas o job requer keystore"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/codemagic.keystore"
          if [ ! -s "${GITHUB_WORKSPACE}/codemagic.keystore" ]; then
            echo "::error::Falha ao decodificar keystore"
            exit 1
          fi
        fi

        for key in $REQUIRED_ENV_KEYS; do
          grep -q "^${key}=" .env || echo "::warning::$key não encontrada em .env (pode causar crash no boot do app)"
        done
